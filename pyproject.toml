[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "semantic-keywords"
version         = "0.1.0"
description     = "AI-powered semantic keyword extraction using sentence embeddings and MMR"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.9"

authors = [
    { name = "Ronald Isack Gosso", email = "ronaldgosso@gmail.com" },
]

keywords = [
    "keywords", "nlp", "semantic", "embeddings",
    "sentence-transformers", "mmr", "text-analysis",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "sentence-transformers>=2.7",
    "numpy>=1.24",
]

[project.urls]
Homepage      = "https://ronaldgosso.github.io/semantic-keywords"
Repository    = "https://github.com/ronaldgosso/semantic-keywords"
"Bug Tracker" = "https://github.com/ronaldgosso/semantic-keywords/issues"

[project.scripts]
semkw = "semantic_keywords.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["semantic_keywords*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version       = "3.9"
warn_return_any      = true
warn_unused_configs  = true
ignore_missing_imports = true

[tool.black]
line-length    = 100
target-version = ["py39"]
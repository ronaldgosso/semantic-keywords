[build-system]
requires      = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "semantic-keywords"
version         = "0.2.5"
description     = "AI-powered semantic keyword extraction using sentence embeddings and MMR"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.9"

authors = [
    { name = "Ronald Isack Gosso", email = "ronaldgosso@gmail.com" },
]

keywords = [
    "keywords", "nlp", "semantic", "embeddings",
    "sentence-transformers", "mmr", "text-analysis", "pdf",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core deps — pypdf is OPTIONAL (only needed for PDF files)
dependencies = [
    "sentence-transformers>=2.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
# pip install semantic-keywords[files]
files = [
    "pypdf>=4.0",
]
# pip install semantic-keywords[dev]
dev = [
    "ruff>=0.4",
    "mypy>=1.9",
    "black>=24.0",
    "build>=1.0",
    "twine>=5.0",
    "pypdf>=4.0",
]

[project.urls]
Homepage      = "https://ronaldgosso.github.io/semantic-keywords"
Repository    = "https://github.com/ronaldgosso/semantic-keywords"
"Bug Tracker" = "https://github.com/ronaldgosso/semantic-keywords/issues"

[project.scripts]
semkw = "semantic_keywords.cli:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["semantic_keywords*"]

[tool.ruff]
line-length    = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["semantic_keywords"]

[tool.mypy]
python_version         = "3.10"
warn_return_any        = true
warn_unused_configs    = true
ignore_missing_imports = true
strict                 = false

[tool.black]
line-length    = 100
target-version = ["py39"]
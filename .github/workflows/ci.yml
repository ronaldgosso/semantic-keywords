# .github/workflows/ci.yml
# Runs on every push and pull request.
# Lints with ruff, checks types with mypy, formats with black.
# This is the gatekeeper workflow — all others depend on its success.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff — lint
        run: ruff check semantic_keywords/

      - name: Ruff — import sort check
        run: ruff check --select I semantic_keywords/

      - name: Black — format check
        run: black --check semantic_keywords/

      - name: Mypy — type check
        run: mypy semantic_keywords/
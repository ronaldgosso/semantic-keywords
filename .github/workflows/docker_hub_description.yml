# .github/workflows/docker_hub_description.yml
# Updates Docker Hub description from README_DOCKER.md on changes.
# Runs after Docker workflow completes successfully.

name: Update Docker Hub Description

on:
  workflow_run:
    workflows: ["Docker"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

jobs:
  update-description:
    name: Update Docker Hub Description
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_FA }}
          repository: ronaldgosso/semantic-keywords
          readme-filepath: README_DOCKER.md
